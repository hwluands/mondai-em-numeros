name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes da API e do painel
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint do pipeline
        run: pipx run ruff check pipeline/
