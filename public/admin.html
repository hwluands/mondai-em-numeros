<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registros · Mondaí em Números</title>
<style>
  :root {
    --bg: #f4f5f3; --card: #fff; --text: #18201b; --muted: #56605a; --line: #dde2de;
    --c1: #1f6f43; --c2: #c06a1b; --c3: #2f5d9e; --erro: #b3261e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.45; }
  .largura { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  input, select, button { font: inherit; font-size: 0.9rem; min-height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); color: var(--text); padding: 6px 12px; }
  button { cursor: pointer; border-color: var(--c1); color: var(--c1); }
  button.principal { background: var(--c1); color: #fff; font-weight: 650; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--c2); outline-offset: 2px; }
  .entrar { max-width: 380px; display: grid; gap: 10px; }
  .erro { color: var(--erro); font-size: 0.88rem; margin: 0; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .numeros { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 14px; }
  .num { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .num span { display: block; font-size: 0.78rem; color: var(--muted); }
  .num strong { font-size: 1.5rem; }
  .duas { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
  .grafico { position: relative; height: 240px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--card); }
  .rolagem { overflow: auto; max-height: 560px; }
  .tag { font-size: 0.75rem; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); white-space: nowrap; }
  .tag.acesso { border-color: var(--c1); color: var(--c1); }
  .tag.opiniao { border-color: var(--c2); color: var(--c2); }
  .tag.retorno { border-color: var(--c3); color: var(--c3); }
  .vazio { color: var(--muted); }
  @media (max-width: 900px) { .numeros { grid-template-columns: repeat(3, 1fr); } .duas { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .numeros { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main class="largura">
  <h1>Registros do painel</h1>
  <p class="sub">Mondaí em Números · acessos, retornos e opiniões gravados pela API. Datas e horas no horário de Brasília.</p>

  <form class="card entrar" id="formEntrar">
    <label for="senha"><b>Senha de administrador</b></label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <button type="submit" class="principal">Entrar</button>
    <p class="erro" id="erro" hidden></p>
  </form>

  <div id="area" hidden>
    <div class="barra">
      <label>Mostrar
        <select id="filtro">
          <option value="">Todos os registros</option>
          <option value="acesso">Acessos</option>
          <option value="retorno">Retornos</option>
          <option value="opiniao">Opiniões</option>
        </select>
      </label>
      <div class="acoes">
        <button type="button" id="atualizar">Atualizar</button>
        <button type="button" id="baixar" class="principal">Baixar CSV</button>
        <button type="button" id="sair">Sair</button>
      </div>
    </div>

    <div class="numeros" id="numeros"></div>

    <div class="duas">
      <div class="card"><h2>Acessos por dia</h2><div class="grafico"><canvas id="porDia" role="img" aria-label="Acessos por dia"></canvas></div></div>
      <div class="card"><h2>Pessoas identificadas por cidade</h2><div class="rolagem" style="max-height:240px" id="cidades"></div></div>
    </div>

    <div class="card">
      <h2 id="tituloTabela">Registros</h2>
      <div class="rolagem" id="tabela"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  const CHAVE = "mondai-admin";
  const guardar = {
    ler() { try { return sessionStorage.getItem(CHAVE); } catch (e) { return null; } },
    salvar(s) { try { sessionStorage.setItem(CHAVE, s); } catch (e) {} },
    apagar() { try { sessionStorage.removeItem(CHAVE); } catch (e) {} }
  };
  let senha = guardar.ler();
  let registros = [];
  let grafico = null;

  const dataHora = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const dia = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" });
  const diaChave = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" });
  const NOMES_TIPO = { acesso: "Acesso", retorno: "Retorno", opiniao: "Opinião" };
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function api(caminho) {
    const r = await fetch(caminho, { headers: { Authorization: "Bearer " + senha } });
    if (r.status === 401) throw new Error("Senha incorreta.");
    if (!r.ok) throw new Error("A API respondeu com erro " + r.status + ".");
    return r;
  }

  async function carregar() {
    const erro = document.getElementById("erro");
    erro.hidden = true;
    try {
      registros = await (await api("/api/registros")).json();
    } catch (e) {
      guardar.apagar();
      senha = null;
      erro.textContent = e.message;
      erro.hidden = false;
      document.getElementById("formEntrar").hidden = false;
      document.getElementById("area").hidden = true;
      return;
    }
    document.getElementById("formEntrar").hidden = true;
    document.getElementById("area").hidden = false;
    mostrar();
  }

  function mostrar() {
    const identificados = new Map();
    registros.filter(r => r.nome).forEach(r => identificados.set(r.visitante, r));
    const pessoas = new Set(registros.map(r => r.visitante)).size;
    const deMondai = [...identificados.values()].filter(r => r.cidade === "Mondaí").length;
    const cidades = new Map();
    identificados.forEach(r => cidades.set(r.cidade, (cidades.get(r.cidade) || 0) + 1));
    const opinioes = registros.filter(r => r.tipo === "opiniao");
    const media = opinioes.length ? opinioes.reduce((s, r) => s + r.nota, 0) / opinioes.length : null;

    const numeros = [
      ["Pessoas (navegadores)", pessoas], ["Identificadas", identificados.size], ["De Mondaí", deMondai],
      ["Cidades", cidades.size], ["Opiniões", opinioes.length],
      ["Nota média", media === null ? "–" : media.toLocaleString("pt-BR", { maximumFractionDigits: 1 })]
    ];
    document.getElementById("numeros").innerHTML = numeros.map(([r, v]) => '<div class="num"><span>' + r + "</span><strong>" + v + "</strong></div>").join("");

    document.getElementById("cidades").innerHTML = cidades.size
      ? "<table><thead><tr><th>Cidade</th><th>Pessoas</th></tr></thead><tbody>" +
        [...cidades.entries()].sort((a, b) => b[1] - a[1]).map(([c, n]) => "<tr><td>" + esc(c) + "</td><td>" + n + "</td></tr>").join("") + "</tbody></table>"
      : '<p class="vazio">Ninguém se identificou ainda.</p>';

    const porDia = new Map();
    registros.filter(r => r.tipo !== "opiniao").forEach(r => {
      const k = diaChave.format(new Date(r.criado_em));
      porDia.set(k, (porDia.get(k) || 0) + 1);
    });
    const dias = [...porDia.keys()].sort();
    if (grafico) grafico.destroy();
    if (window.Chart) {
      grafico = new Chart(document.getElementById("porDia"), {
        type: "bar",
        data: { labels: dias.map(d => dia.format(new Date(d + "T12:00:00Z"))), datasets: [{ data: dias.map(d => porDia.get(d)), backgroundColor: "#1f6f43" }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }

    const filtro = document.getElementById("filtro").value;
    const linhas = registros.filter(r => !filtro || r.tipo === filtro);
    document.getElementById("tituloTabela").textContent = "Registros (" + linhas.length + ")";
    document.getElementById("tabela").innerHTML = linhas.length
      ? "<table><thead><tr><th>Data e hora</th><th>Tipo</th><th>Nome</th><th>Cidade</th><th>Nota</th><th>Comentário</th></tr></thead><tbody>" +
        linhas.map(r => "<tr><td>" + dataHora.format(new Date(r.criado_em)) + '</td><td><span class="tag ' + r.tipo + '">' + NOMES_TIPO[r.tipo] + "</span></td><td>" +
          (r.nome ? esc(r.nome) : '<span class="vazio">sem identificação</span>') + "</td><td>" + esc(r.cidade) + "</td><td>" + (r.nota ?? "") + "</td><td>" + esc(r.comentario) + "</td></tr>").join("") +
        "</tbody></table>"
      : '<p class="vazio">Nenhum registro ainda.</p>';
  }

  document.getElementById("formEntrar").addEventListener("submit", e => {
    e.preventDefault();
    senha = document.getElementById("senha").value;
    guardar.salvar(senha);
    carregar();
  });
  document.getElementById("atualizar").addEventListener("click", carregar);
  document.getElementById("filtro").addEventListener("change", mostrar);
  document.getElementById("sair").addEventListener("click", () => { guardar.apagar(); location.reload(); });
  document.getElementById("baixar").addEventListener("click", async () => {
    try {
      const blob = await (await api("/api/registros?formato=csv")).blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "registros_mondai_em_numeros.csv";
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) { alert(e.message); }
  });

  if (senha) carregar();
</script>
</body>
</html>
