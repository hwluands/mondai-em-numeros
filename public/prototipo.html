<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Protótipo visual · Mondaí em Números</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/prototipo.css">
</head>
<body>
<header class="cabecalho">
  <div class="largura">
    <a class="nome" href="#">Mondaí em Números</a>
    <span class="edicao" id="edicao"></span>
  </div>
</header>

<main>
  <section class="abertura largura" aria-labelledby="manchete">
    <h1 id="manchete"></h1>
    <p class="lide" id="lide"></p>

    <figure class="faixa-295" id="faixaAbertura"></figure>

    <dl class="ficha" id="ficha"></dl>
  </section>

  <article class="historia largura" id="historia-1" aria-labelledby="h1-t">
    <div class="historia-texto">
      <p class="secao">Riqueza e salário</p>
      <h2 id="h1-t"></h2>
      <p id="h1-p"></p>
    </div>
    <figure class="figura">
      <figcaption class="figura-titulo"><b>Figura 1.</b> As 295 cidades de SC em dois rankings. Cada traço é uma cidade, da maior para a menor.</figcaption>
      <div id="fig1"></div>
      <p class="fonte">Fonte: IBGE, PIB dos Municípios 2023 e Cadastro Central de Empresas 2024.</p>
    </figure>
  </article>
</main>

<footer class="rodape">
  <div class="largura">Protótipo visual · abertura e primeira história com os dados reais do painel</div>
</footer>

<script src="dados/painel.js"></script>
<script type="module" src="js/prototipo.js"></script>
</body>
</html>
