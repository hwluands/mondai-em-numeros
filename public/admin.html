<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registros · Mondaí em Números</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
  try { if (localStorage.getItem("mondai-tema") === "claro") document.documentElement.dataset.tema = "claro"; } catch (e) {}
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="largura">
  <h1>Registros do painel</h1>
  <p class="sub">Mondaí em Números · acessos, retornos e opiniões gravados pela API. Datas e horas no horário de Brasília.</p>

  <form class="card entrar" id="formEntrar">
    <label for="senha"><b>Senha de administrador</b></label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <button type="submit" class="principal">Entrar</button>
    <p class="erro" id="erro" hidden></p>
  </form>

  <div id="area" hidden>
    <div class="barra">
      <label>Mostrar
        <select id="filtro">
          <option value="">Todos os registros</option>
          <option value="acesso">Acessos</option>
          <option value="retorno">Retornos</option>
          <option value="opiniao">Opiniões</option>
        </select>
      </label>
      <div class="acoes">
        <button type="button" id="atualizar">Atualizar</button>
        <button type="button" id="baixar" class="principal">Baixar CSV</button>
        <button type="button" id="sair">Sair</button>
      </div>
    </div>

    <div class="numeros" id="numeros"></div>

    <div class="duas">
      <div class="card"><h2>Acessos por dia</h2><div class="grafico"><canvas id="porDia" role="img" aria-label="Acessos por dia"></canvas></div></div>
      <div class="card"><h2>Pessoas identificadas por cidade</h2><div class="rolagem curta" id="cidades"></div></div>
    </div>

    <div class="card">
      <h2 id="tituloTabela">Registros</h2>
      <div class="rolagem" id="tabela"></div>
    </div>
  </div>
</main>

<script src="vendor/chart.umd.min.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
